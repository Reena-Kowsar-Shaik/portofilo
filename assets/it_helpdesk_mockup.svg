    <rect x="340" y="91" width="70" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
    <text x="350" y="105" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold">RESOLVED</text>

