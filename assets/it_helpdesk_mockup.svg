    <text x="80" y="156" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Wed</text>
    <text x="115" y="156" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Thu</text>
